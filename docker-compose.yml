services:
  db:
    image: postgis/postgis:16-3.4
    container_name: floodcast-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: floodcast
      POSTGRES_PASSWORD: floodcast_password
      POSTGRES_DB: floodcast_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floodcast -d floodcast_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: floodcast-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg2://floodcast:floodcast_password@db:5432/floodcast_db
      - HOST=0.0.0.0
      - PORT=8000
      - DEMO_MODE=True
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: floodcast-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
