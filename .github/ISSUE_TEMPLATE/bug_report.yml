name: Bug Report
description: Report an issue or bug in FloodCast AI software, API, or dashboard.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please verify that this bug has not already been reported and do not include confidential credentials or private personal data.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Start backend with `python -m uvicorn app.main:app`
        2. Query endpoint `GET /api/v1/...`
        3. Observe error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually occurred.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - "Backend (FastAPI / Database)"
        - "Frontend (React / MapLibre)"
        - "Machine Learning (Training / Inference)"
        - "Geospatial Data Processing"
        - "Docker / DevOps / CI"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: OS version, Python version, Node version, browser, database type (SQLite / PostgreSQL).
      placeholder: |
        - OS: Windows 11 / Ubuntu 22.04 / macOS
        - Python: 3.11.x
        - Node.js: 20.x
        - Browser: Chrome 120 / Firefox 121
        - Database: SQLite / PostgreSQL 16 + PostGIS
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Terminal Output
      description: Paste relevant stack traces or console errors here (ensure no secrets or API keys are present).
      render: shell
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Confirmation
      options:
        - label: I have verified that no sensitive credentials or personal data are included in this report.
          required: true
        - label: I have checked existing issues to verify this is not a duplicate.
          required: true
